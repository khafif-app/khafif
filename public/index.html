<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1419">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<title>خفيف</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: sans-serif; background: #0f1419; color: #e7e9ea; height: 100dvh; display: flex; flex-direction: column; }
  .view { display: none; flex-direction: column; height: 100dvh; }
  .view.active { display: flex; }
  #onboard { margin: auto; display: none; flex-direction: column; gap: 10px; width: min(90vw, 320px); height: auto; }
  #onboard.active { display: flex; }
  #onboard h2 { text-align: center; margin-bottom: 8px; }
  #onboard p { color: #71767b; font-size: 13px; text-align: center; }
  input { padding: 12px; border-radius: 10px; border: 1px solid #2f3336; background: #16181c; color: inherit; font-size: 16px; }
  button { border: none; cursor: pointer; color: #fff; background: #1d9bf0; }
  #onboard button { padding: 12px; border-radius: 10px; font-weight: bold; font-size: 16px; }
  header { display: flex; gap: 8px; align-items: center; padding: 10px; border-bottom: 1px solid #2f3336; }
  header .title { flex: 1; font-weight: bold; display: flex; align-items: center; gap: 6px; }
  header button { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  header button.off { background: #536471; }
  header button.icon { background: none; padding: 6px; color: #9aa0a6; }
  button svg { display: block; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #536471; display: inline-block; }
  .dot.on { background: #00ba7c; }
  #addRow { display: flex; gap: 8px; padding: 10px; border-bottom: 1px solid #2f3336; }
  #addRow input { flex: 1; }
  #addRow button { padding: 10px 16px; border-radius: 10px; font-weight: bold; }
  #lists { flex: 1; overflow-y: auto; }
  .row { display: flex; align-items: center; gap: 10px; padding: 14px 12px; border-bottom: 1px solid #1d2226; cursor: pointer; }
  .row .nm { flex: 1; font-size: 16px; }
  .row .hint { color: #71767b; font-size: 12px; }
  .row button { padding: 6px 14px; border-radius: 14px; font-size: 13px; background: #00ba7c; }
  .sec { padding: 10px 12px 4px; color: #71767b; font-size: 13px; }
  #msgs { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
  .msg { max-width: 80%; padding: 8px 12px; border-radius: 14px; background: #1d9bf0; align-self: flex-end; word-break: break-word; }
  .msg.other { background: #2f3336; align-self: flex-start; }
  .msg.sys { background: none; color: #71767b; align-self: center; font-size: 13px; }
  #bar { display: flex; gap: 8px; padding: 10px; border-top: 1px solid #2f3336; align-items: center; }
  #bar input { flex: 1; border-radius: 20px; }
  #bar button { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; }
  #bar button.off { background: #e0245e; }
  #remoteWrap { display: none; background: #000; }
  #remoteWrap video { width: 100%; max-height: 40dvh; }
  #status { font-size: 12px; color: #71767b; padding: 0 10px 4px; min-height: 16px; }
  #ostatus { font-size: 15px; padding: 10px; min-height: 24px; text-align: center; border-radius: 8px; }
  #ostatus.err { background: #3d1f28; color: #ff6b78; font-weight: bold; }
  #ostatus.ok { background: #0f2b1d; color: #00ba7c; }
  #onboard button:disabled { opacity: .5; }
  .badge { background: #1d9bf0; color: #fff; border-radius: 12px; padding: 2px 9px; font-size: 12px; font-weight: bold; }

  .view.active { animation: viewIn .22s ease-out; }
  @keyframes viewIn { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
  .msg { animation: msgIn .18s ease-out; }
  @keyframes msgIn { from { opacity: 0; transform: translateY(8px) scale(.96); } to { opacity: 1; transform: none; } }
  #bar button.off { animation: recPulse 1.1s ease-in-out infinite; }
  @keyframes recPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(224,36,94,.55); } 50% { box-shadow: 0 0 0 12px rgba(224,36,94,0); } }
</style>
</head>
<body>

<div id="onboard" class="view active">
  <h2>خفيف</h2>
  <input id="username" placeholder="اسم المستخدم" autocomplete="off" style="text-align:center">
  <input id="password" type="password" placeholder="باسورد (8 حروف على الأقل)" style="text-align:center">
  <button onclick="doLogin()">تسجيل دخول</button>
  <button onclick="doRegister()" style="background:#2f3336">إنشاء حساب جديد</button>
  <p>أول مرة؟ اضغط «إنشاء حساب جديد». عندك حساب؟ «تسجيل دخول». مفيش استرجاع باسورد، فاكتبه عندك.</p>
  <p id="ostatus"></p>
</div>

<div id="home" class="view">
  <header>
    <div class="title">خفيف <span class="hint" id="meName" style="color:#71767b;font-weight:normal"></span></div>
  </header>
  <div style="padding:8px 10px 0"><button id="pushBtn" style="display:none;padding:8px 14px;border-radius:8px;width:100%" onclick="askPush()">فعّل الإشعارات عشان توصلك الرسايل وانت قافل</button></div>
  <div id="addRow">
    <input id="friendName" placeholder="اسم مستخدم صاحبك" autocomplete="off">
    <button onclick="addFriend()">إضافة صديق</button>
  </div>
  <div id="lists"></div>
  <div id="status" style="padding:6px 10px"></div>
</div>

<div id="chat" class="view">
  <header>
    <button class="icon" onclick="showView('home')" title="رجوع">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
    </button>
    <div class="title"><span class="dot" id="peerDot"></span><span id="peerName"></span></div>
    <button id="callBtn" onclick="toggleCall()" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
      مكالمة
    </button>
    <button id="shareBtn" onclick="toggleShare()" style="display:none">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
      شاشة
    </button>
  </header>
  <div id="remoteWrap"><video id="remoteVideo" autoplay playsinline></video></div>
  <div id="msgs"></div>
  <div id="status2" style="font-size:12px;color:#71767b;padding:0 10px 4px;min-height:16px"></div>
  <input id="filePick" type="file" accept="image/*,video/*" style="display:none" onchange="sendMedia(this)">
  <div id="bar">
    <button id="attachBtn" onclick="document.getElementById('filePick').click()" title="صورة أو فيديو">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
    </button>
    <button id="micBtn" onclick="toggleRec()" title="رسالة صوتية">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/></svg>
    </button>
    <input id="text" placeholder="اكتب رسالة..." onkeydown="if(event.key==='Enter')sendChat()">
    <button onclick="sendChat()" title="إرسال">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="transform:scaleX(-1)"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
let ws, pc, localStream, screenStream, polite = false;
let makingOffer = false, ignoreOffer = false;
let me = null, token = null, peer = null;
let creds = null, authed = false, reconnectTimer = null, authTimer = null, elsewhereRetries = 0;
let friends = {}, requests = [], unread = {};
const ICE = {
  iceServers: [
    { urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302'] },
    { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turn:openrelay.metered.ca:443?transport=tcp'],
      username: 'openrelayproject', credential: 'openrelayproject' },
  ],
};
const $ = id => document.getElementById(id);
// call/share buttons hidden for chat milestone

function showView(v) {
  for (const el of document.querySelectorAll('.view')) el.classList.remove('active');
  $(v).classList.add('active');
  if (v === 'home') renderLists();
}
function setStatus(s, kind) {
  $('status2').textContent = s; $('status').textContent = s;
  const o = $('ostatus'); o.textContent = s; o.className = kind || '';
}
function busy(on) { for (const b of document.querySelectorAll('#onboard button')) b.disabled = on; }

function connect(msg) {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');
  ws.onopen = () => ws.send(JSON.stringify(msg));
  ws.onmessage = e => onMsg(JSON.parse(e.data));
  ws.onerror = () => {
    if (!authed) { setStatus('مش قادر أوصل للسيرفر. شيك على النت وجرب تاني.', 'err'); busy(false); }
  };
  ws.onclose = () => {
    if (authed && creds) {
      setStatus('انقطع الاتصال، بنرجع نتصل...', 'ok');
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connect({ t: 'login', username: creds.u, password: creds.p }), 2000);
    } else if (!authed) {
      setStatus('مش قادر أوصل للسيرفر دلوقتي. ممكن يكون بيصحى، استنى شوية واضغط تاني.', 'err');
      busy(false);
    }
  };
}
function doLogin() { startAuth('login'); }
function doRegister() { startAuth('register'); }
function startAuth(kind) {
  const u = $('username').value.trim();
  const p = $('password').value;
  if (!u || !p) { setStatus('اكتب اسم المستخدم والباسورد', 'err'); return; }
  me = u;
  authed = false;
  localStorage.setItem('khafif_user', u);
  busy(true);
  setStatus('لحظة، بنوصل للسيرفر...', 'ok');
  clearTimeout(authTimer);
  authTimer = setTimeout(() => {
    if (!authed) { setStatus('السيرفر بيصحى أو النت ضعيف. استنى شوية واضغط تاني.', 'err'); busy(false); }
  }, 15000);
  connect({ t: kind, username: u, password: p });
}
function addFriend() {
  const u = $('friendName').value.trim();
  if (!u || !ws) return;
  ws.send(JSON.stringify({ t: 'friend_add', username: u }));
  $('friendName').value = '';
}
function acceptFriend(u) { ws.send(JSON.stringify({ t: 'friend_accept', username: u })); }
let seenKeys = new Set();
function openChat(u) {
  peer = u;
  delete unread[u];
  seenKeys = new Set();
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'open_chat', with: u }));
  $('peerName').textContent = u;
  $('peerDot').className = 'dot' + (friends[u] ? ' on' : '');
  $('msgs').innerHTML = '';
  setStatus('');
  showView('chat');
}

function onMsg(m) {
  if (m.t === 'registered' || m.t === 'logged_in') {
    authed = true;
    elsewhereRetries = 0;
    creds = { u: $('username').value.trim(), p: $('password').value };
    clearTimeout(authTimer);
    busy(false);
    me = m.username;
    $('meName').textContent = '@' + m.username;
    setStatus('');
    showView('home');
  } else if (m.t === 'state') {
    friends = {};
    for (const f of m.friends) friends[f.name] = f.online;
    requests = m.requests;
    unread = m.unread || {};
    renderLists();
    if (peer) $('peerDot').className = 'dot' + (friends[peer] ? ' on' : '');
  } else if (m.t === 'presence') {
    if (m.user in friends) friends[m.user] = m.online;
    if ($('home').classList.contains('active')) renderLists();
    if (peer === m.user) $('peerDot').className = 'dot' + (m.online ? ' on' : '');
  } else if (m.t === 'friend_request') {
    if (!requests.includes(m.from)) requests.push(m.from);
    if ($('home').classList.contains('active')) renderLists();
    setStatus('طلب صداقة من ' + m.from);
  } else if (m.t === 'friend_added') {
    friends[m.user] = true;
    requests = requests.filter(x => x !== m.user);
    renderLists();
    setStatus(m.user + ' بقى صديقك');
  } else if (m.t === 'backlog_done') {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'backlog_ack', with: m.with }));
  } else if (m.t === 'chat' || m.t === 'voice' || m.t === 'media') {
    const mine = m.from === me;
    const key = m.from + ':' + m.ts;
    if (seenKeys.has(key)) return;
    if ((peer === m.from || mine) && $('chat').classList.contains('active')) {
      seenKeys.add(key);
      if (m.t === 'chat') addMsg(m.text, !mine);
      else if (m.t === 'media') addMedia(m.data, m.mime, !mine);
      else addVoice(m.data, m.mime, !mine);
      if (!mine && ws && ws.readyState === 1) ws.send(JSON.stringify({ t: 'backlog_ack', with: m.from }));
    } else if (!mine) {
      setStatus('رسالة جديدة من ' + m.from);
    }
  } else if (m.t === 'signal') {
    if (m.from === peer) onSignal(m.data);
  } else if (m.t === 'error') {
    setStatus(m.text, 'err');
    if (m.code === 'online_elsewhere' && authed && creds && elsewhereRetries < 9) {
      // Stale session on the server: its heartbeat culls it within ~30s. Keep retrying.
      elsewhereRetries++;
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(() => connect({ t: 'login', username: creds.u, password: creds.p }), 5000);
      setStatus('بنرجع نتصل...', 'ok');
    } else if (!authed) {
      clearTimeout(authTimer);
      busy(false);
    }
  } else if (m.t === 'info') {
    setStatus(m.text, 'ok');
  }
}

function renderLists() {
  const el = $('lists');
  el.innerHTML = '';
  if (requests.length) {
    const s = document.createElement('div'); s.className = 'sec'; s.textContent = 'طلبات صداقة'; el.appendChild(s);
    for (const r of requests) {
      const d = document.createElement('div'); d.className = 'row';
      const n = document.createElement('span'); n.className = 'nm'; n.textContent = r; d.appendChild(n);
      const b = document.createElement('button'); b.textContent = 'قبول'; b.onclick = () => acceptFriend(r); d.appendChild(b);
      el.appendChild(d);
    }
  }
  const names = Object.keys(friends);
  if (names.length) {
    const s = document.createElement('div'); s.className = 'sec'; s.textContent = 'الأصحاب'; el.appendChild(s);
    for (const f of names) {
      const d = document.createElement('div'); d.className = 'row'; d.onclick = () => openChat(f);
      const dot = document.createElement('span'); dot.className = 'dot' + (friends[f] ? ' on' : ''); d.appendChild(dot);
      const n = document.createElement('span'); n.className = 'nm'; n.textContent = f; d.appendChild(n);
      if (unread[f]) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = unread[f]; d.appendChild(b); }
      const h = document.createElement('span'); h.className = 'hint'; h.textContent = friends[f] ? 'متصل' : 'مش متصل'; d.appendChild(h);
      el.appendChild(d);
    }
  } else if (!requests.length) {
    const s = document.createElement('div'); s.className = 'sec'; s.textContent = 'لسه مفيش أصحاب. اطلب من صاحبك اسم المستخدم بتاعه وضيفه فوق.'; el.appendChild(s);
  }
}

function addMsg(text, other) {
  const d = document.createElement('div');
  d.className = 'msg' + (other ? ' other' : '');
  d.appendChild(document.createTextNode(text));
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function addVoice(b64, mime, other) {
  const d = document.createElement('div');
  d.className = 'msg' + (other ? ' other' : '');
  const a = document.createElement('audio');
  a.controls = true;
  a.src = 'data:' + mime + ';base64,' + b64;
  a.style.maxWidth = '220px';
  d.appendChild(a);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
function sendChat() {
  const v = $('text').value.trim();
  if (!v || !ws || ws.readyState !== 1 || !peer) return;
  ws.send(JSON.stringify({ t: 'chat', to: peer, text: v }));
  addMsg(v, false);
  $('text').value = '';
}

function addMedia(b64, mime, other) {
  const d = document.createElement('div');
  d.className = 'msg' + (other ? ' other' : '');
  let el;
  if (mime.startsWith('image/')) { el = document.createElement('img'); el.style.maxWidth = '220px'; el.style.borderRadius = '10px'; }
  else { el = document.createElement('video'); el.controls = true; el.style.maxWidth = '220px'; el.style.borderRadius = '10px'; }
  el.src = 'data:' + mime + ';base64,' + b64;
  d.appendChild(el);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}
const MAX_MEDIA_BYTES = 2800 * 1000; // ~2.8MB binary -> ~3.7M base64 chars, under server cap
function sendMedia(input) {
  const f = input.files && input.files[0];
  input.value = '';
  if (!f || !peer || !ws || ws.readyState !== 1) return;
  const done = (b64, mime) => {
    ws.send(JSON.stringify({ t: 'media', to: peer, data: b64, mime: mime }));
    addMedia(b64, mime, false);
    setStatus('');
  };
  if (f.type.startsWith('image/')) {
    // Compress: max 1280px, JPEG 0.82 - keeps Neon free storage alive
    const img = new Image();
    img.onload = () => {
      const sc = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const url = c.toDataURL('image/jpeg', 0.82);
      URL.revokeObjectURL(img.src);
      done(url.split(',')[1], 'image/jpeg');
    };
    img.onerror = () => setStatus('الصورة دي مش راضية تتقري', 'err');
    img.src = URL.createObjectURL(f);
  } else if (f.type === 'video/mp4' || f.type === 'video/webm') {
    if (f.size > MAX_MEDIA_BYTES) { setStatus('الفيديو كبير (الحد حوالي 2.8 ميجا). جرب فيديو أقصر.', 'err'); return; }
    const r = new FileReader();
    r.onload = () => done(String(r.result).split(',')[1], f.type);
    r.readAsDataURL(f);
  } else {
    setStatus('اختار صورة أو فيديو mp4/webm', 'err');
  }
}

let rec, recChunks;
async function toggleRec() {
  const btn = $('micBtn');
  if (rec && rec.state === 'recording') { rec.stop(); return; }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { setStatus('محتاج إذن المايك'); return; }
  recChunks = [];
  rec = new MediaRecorder(stream);
  rec.ondataavailable = e => recChunks.push(e.data);
  rec.onstop = () => {
    stream.getTracks().forEach(t => t.stop());
    btn.classList.remove('off');
    setStatus('');
    const blob = new Blob(recChunks, { type: rec.mimeType });
    if (blob.size < 1000) return;
    if (blob.size > 300000) { setStatus('التسجيل طويل، جرب أقصر'); return; }
    const r = new FileReader();
    r.onload = () => {
      const b64 = String(r.result).split(',')[1];
      ws.send(JSON.stringify({ t: 'voice', to: peer, data: b64, mime: rec.mimeType }));
      addVoice(b64, rec.mimeType, false);
    };
    r.readAsDataURL(blob);
  };
  rec.start();
  btn.classList.add('off');
  setStatus('بي سجّل... اضغط تاني للإرسال');
}

// Web Push: notifications for messages that arrive while the app is closed.
let swReg = null;
function urlB64(s) { const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, c => c.charCodeAt(0)); }
async function initPush() {
  try {
    if (!('serviceWorker' in navigator) || !('PushManager' in window) || typeof Notification === 'undefined') return;
    swReg = await navigator.serviceWorker.register('/sw.js');
    if (Notification.permission === 'granted') return subscribePush();
    if (Notification.permission === 'default') $('pushBtn').style.display = '';
  } catch (e) {}
}
async function askPush() {
  try {
    const r = await Notification.requestPermission();
    if (r === 'granted') return subscribePush();
    setStatus('من غير إذن الإشعارات مش هتوصلك تنبيهات وانت قافل');
  } catch (e) {}
}
async function subscribePush() {
  try {
    const key = await (await fetch('/vapid-public')).text();
    if (!key || !swReg) return;
    const sub = await swReg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(key.trim()) });
    ws.send(JSON.stringify({ t: 'push_sub', sub: sub.toJSON() }));
    $('pushBtn').style.display = 'none';
    setStatus('الإشعارات مفعّلة');
  } catch (e) { setStatus('الإشعارات مش متاحة على المتصفح ده'); }
}

function newPeer(isPolite) {
  polite = isPolite;
  pc = new RTCPeerConnection(ICE);
  pc.onicecandidate = e => { if (e.candidate) sig({ candidate: e.candidate }); };
  pc.onnegotiationneeded = async () => {
    try {
      makingOffer = true;
      await pc.setLocalDescription();
      sig({ description: pc.localDescription });
    } catch (e) {} finally { makingOffer = false; }
  };
  pc.ontrack = e => {
    if (e.track.kind === 'audio') $('remoteAudio').srcObject = e.streams[0];
    else { $('remoteWrap').style.display = 'block'; $('remoteVideo').srcObject = e.streams[0]; }
  };
  pc.onconnectionstatechange = () => setStatus('حالة المكالمة: ' + pc.connectionState);
}
function sig(data) { if (ws && ws.readyState === 1 && peer) ws.send(JSON.stringify({ t: 'signal', to: peer, data })); }

async function onSignal(data) {
  try {
    if (data.description) {
      if (!pc) { newPeer(true); await ensureMic(); $('callBtn').classList.add('off'); }
      const offerCollision = data.description.type === 'offer' && (makingOffer || pc.signalingState !== 'stable');
      ignoreOffer = !polite && offerCollision;
      if (ignoreOffer) return;
      await pc.setRemoteDescription(data.description);
      if (data.description.type === 'offer') {
        await pc.setLocalDescription();
        sig({ description: pc.localDescription });
      }
    } else if (data.candidate) {
      try { await pc.addIceCandidate(data.candidate); } catch (e) { if (!ignoreOffer) throw e; }
    }
  } catch (e) {}
}

async function ensureMic() {
  localStream = await navigator.mediaDevices.getUserMedia({ audio: true });
  for (const t of localStream.getTracks()) pc.addTrack(t, localStream);
}

async function toggleCall() {
  const btn = $('callBtn');
  if (!pc) {
    newPeer(false);
    try { await ensureMic(); } catch (e) { setStatus('محتاج إذن المايك'); pc.close(); pc = null; return; }
    btn.classList.add('off');
    setStatus('جاري الاتصال...');
  } else {
    if (screenStream) toggleShare();
    if (localStream) localStream.getTracks().forEach(t => t.stop());
    localStream = null;
    pc.close(); pc = null;
    $('remoteWrap').style.display = 'none';
    $('remoteAudio').srcObject = null;
    btn.classList.remove('off');
    setStatus('');
  }
}

async function toggleShare() {
  if (!pc) return;
  const btn = $('shareBtn');
  if (!screenStream) {
    try { screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true }); } catch (e) { return; }
    for (const t of screenStream.getTracks()) pc.addTrack(t, screenStream);
    screenStream.getVideoTracks()[0].onended = () => toggleShare();
    btn.classList.add('off');
  } else {
    screenStream.getTracks().forEach(t => { t.stop(); pc.getSenders().filter(s => s.track === t).forEach(s => pc.removeTrack(s)); });
    screenStream = null;
    btn.classList.remove('off');
  }
}

// prefill username only; passwords are never stored on the device
(function () {
  const u = localStorage.getItem('khafif_user');
  if (u) $('username').value = u;
})();
</script>
